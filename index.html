<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05070A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Instalável no telemóvel e no desktop sem o build nativo do Tauri.
         Ver README §Instalar no telemóvel. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="JARVIS AI OS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- O iOS ignora o manifesto e lê estas três. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JARVIS" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>JARVIS AI OS — Project ARC</title>
    <!--
      O Inter vem do repositório, não do Google Fonts: a PWA instalada tem de
      abrir offline com a tipografia do design, e não com uma de sistema. O
      `preload` do subconjunto latino evita o salto de fonte no primeiro paint.
    -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Aplica o tema guardado antes do primeiro paint, para não haver flash.
      // Mantido inline e minúsculo de propósito: corre antes do bundle.
      try {
        var t = JSON.parse(localStorage.getItem('jarvis.theme') || '"classic"');
        if (t && t !== 'classic') document.documentElement.dataset.theme = t;
      } catch (e) {
        /* localStorage indisponível — fica o tema base */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
