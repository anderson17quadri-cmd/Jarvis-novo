<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05070A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>JARVIS AI OS — Project ARC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica o tema guardado antes do primeiro paint, para não haver flash.
      // Mantido inline e minúsculo de propósito: corre antes do bundle.
      try {
        var t = JSON.parse(localStorage.getItem('jarvis.theme') || '"classic"');
        if (t && t !== 'classic') document.documentElement.dataset.theme = t;
      } catch (e) {
        /* localStorage indisponível — fica o tema base */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
